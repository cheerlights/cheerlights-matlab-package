name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026b
      - uses: matlab-actions/run-build@v2
        with:
          tasks: check test live package
      - uses: actions/upload-artifact@v4
        with:
          name: cheerlights-mltbx
          path: release/cheerlights.mltbx
